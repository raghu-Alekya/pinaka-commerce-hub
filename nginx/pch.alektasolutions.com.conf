server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pch.alektasolutions.com;

    ssl_certificate /etc/letsencrypt/live/pch.alektasolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pch.alektasolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Gateway (3000), including its server-sent event stream.
    location ^~ /connector/api/v1/gateway/ {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
    }

    # Connector webhook service (3001).
    # Public: /connector/api/v1/connectors...
    # Upstream: /api/v1/connectors...
    location ^~ /connector/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Order service (3002).
    location ^~ /connector/api/v1/orders {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Merchant master data and store-type feature/role-template mappings (3003).
    location ^~ /connector/api/v1/store-types {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /connector/api/v1/store_types {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /connector/api/v1/features {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /connector/api/v1/role-templates {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /connector/api/v1/role_templates {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Plans and /plans/:planId/entitlements (all CRUD methods).
    location ^~ /connector/api/v1/plans {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Direct merchant/store API paths (3003); preserve the complete request URI.
    location ~ ^/api/v1/(stores|merchants|store-types|store_types|features|role-templates|role_templates|plans|subscriptions|subscription-plans|reference-data|ids|onboarding|health)(/|$) {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Subscription CRUD/history; merchantId query parameters are preserved.
    location ^~ /connector/api/v1/subscriptions {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /connector/api/v1/subscription-plans {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /connector/api/v1/health {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Merchant service: reference-data (3003).
    location ^~ /connector/api/v1/reference-data {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Merchant service: ids (3003).
    location ^~ /connector/api/v1/ids {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Merchant service: onboarding (3003).
    location ^~ /connector/api/v1/onboarding {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Merchant service (3003), including nested relationships:
    # /merchants/:merchantId/subscriptions/:subscriptionId/stores[/storeId]
    # /merchants/:merchantId/subscriptions/:subscriptionId/entitlements[/featureId]
    # /merchants/:merchantId/stores/:storeId/entitlements[/featureId]
    location ^~ /connector/api/v1/merchants {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Store configuration endpoints, including Website Connector settings (3003).
    location ^~ /connector/api/v1/stores {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Menu service (3004). The controller path is plural: /menus.
    location ^~ /connector/api/v1/menus {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Inventory service (3005).
    location ^~ /connector/api/v1/inventory {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Analytics service (3006). The controller path is /analytics, not /revenue.
    location ^~ /connector/api/v1/analytics {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Notification service (3008) currently exposes only health/readiness.
    location = /connector/api/v1/notifications/health {
        proxy_pass http://127.0.0.1:3008/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/v1/notifications/ready {
        proxy_pass http://127.0.0.1:3008/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (3009) currently exposes only health/readiness.
    location = /connector/api/v1/admin/health {
        proxy_pass http://127.0.0.1:3009/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/v1/admin/ready {
        proxy_pass http://127.0.0.1:3009/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth service (3010): authentication, users, development mailbox and POS account.
    location = /connector/api/v1/auth/health {
        proxy_pass http://127.0.0.1:3010/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/v1/auth/ready {
        proxy_pass http://127.0.0.1:3010/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /connector/api/v1/auth/ {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /connector/api/v1/users {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    # Development mailbox must not be exposed in production.
    location ^~ /connector/api/v1/dev/ { return 404; }
    location = /connector/api/pos/account {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/accept-invitation {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/reset-password {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # POS integration service (3007), following the primary port allocation.
    location ^~ /connector/api/v1/pos {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # React frontend. Keep this last so API requests are not handled by the SPA fallback.
    location / {
        root /var/www/pch;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pch.alektasolutions.com;
    return 301 https://$host$request_uri;
}


